# tmux — classic shell multiplexer (non-agent). Agent-first: stow/herdr
# (same Ctrl-a muscle memory + Catppuccin Latte).
# Prefix is Ctrl-a (press Ctrl-a, release, then the key).
# Cheat sheet (mirrored in stow/herdr/.config/herdr/config.toml):
#   Ctrl-a c      new window          Ctrl-a 1..9   go to window
#   Ctrl-a |      split right         Ctrl-a -      split down
#   Ctrl-h/j/k/l  move between panes (no prefix — works into nvim too)
#   Ctrl-a H/J/K/L  resize pane by 5
#   Ctrl-a d      detach (session keeps running)    ta <name> / tmux attach
#   Ctrl-a T      sesh session picker (fzf)
#   Ctrl-a o      last sesh session
#   Ctrl-a q then 1..9  jump to pane (numbers stay until you type)
#   Ctrl-a s      session tree        Ctrl-a N      window/pane tree
#   Ctrl-a ( / )  prev/next session   Ctrl-a r      reload this config
# Shell: tn/ta/tl/tk session aliases · tm = sesh picker from zsh

# --- Core -------------------------------------------------------------------
set -g prefix C-a                 # Ctrl-a is easier to reach than Ctrl-b
unbind C-b
bind C-a send-prefix              # press Ctrl-a twice to send a literal Ctrl-a

set -g mouse on                   # click panes, drag borders, wheel scroll
set -g base-index 1               # windows number from 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on        # closing window 2 renumbers 3 -> 2
set -sg escape-time 0             # no delay after Esc (matters in nvim)
set -g history-limit 100000
set -g detach-on-destroy off      # killing a session jumps to the next one
set -g exit-empty off             # keep server alive with zero sessions (easier recovery)
set -g focus-events on            # pass focus to apps (nvim autoread)
set -g status-interval 5
set -g set-clipboard on           # use system clipboard when possible
set -g display-time 2000

# Claude Code / Codex / Pi: Shift+Enter must stay distinct from Enter.
# Ghostty speaks kitty/CSI-u; tmux collapses modifiers unless extended-keys
# are forced in CSI-u form. `on` alone is not enough — apps request kitty
# protocol, which tmux ignores. allow-passthrough: OSC notifications +
# Claude progress bar reach the outer terminal (Ghostty/cmux).
# Docs: https://code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# True color so nvim/starship themes render correctly inside tmux.
# Cursor/VS Code integrated terminals are flaky with tmux-256color — use xterm there.
if-shell '[ "$TERM_PROGRAM" = "vscode" ]' \
  'set -g default-terminal "xterm-256color"' \
  'set -g default-terminal "tmux-256color"'
set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# --- Windows / panes (always keep current directory) ------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Prefix + hjkl pane focus (also available without prefix via vim-tmux-navigator)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Session / window navigation
bind ( switch-client -p
bind ) switch-client -n
bind s choose-tree -Zs            # session tree picker (built-in)
bind N choose-tree -Zw            # window/pane tree — jump fast across windows

# Kill pane without confirmation (faster than default prompt)
bind x kill-pane

# Activity / bell — highlight background windows that print or ring
# (classic shell workflows: builds, tests, long jobs). Agent-first Herdr+cmux
# already covers this via sidebar state + cmux Cmd+I / Cmd+Shift+U.
set -g visual-activity on
set -g visual-bell on
set -g bell-action any
setw -g monitor-activity on
setw -g monitor-bell on

# --- Copy mode (vim-style) --------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- sesh: fzf-powered session picker (Ctrl-a T) ----------------------------
# Lists tmux sessions + zoxide directories + configs; picking one attaches/creates.
bind T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' \
    --prompt='⚡ ' \
    --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^f find  ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)' \
    --preview 'sesh preview {}' \
    --preview-window 'right:55%'
)\""

# Jump back to the previous sesh session
bind o run-shell "sesh last || tmux display-message -d 1500 'Only one session'"

# --- Plugins (TPM) ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'    # Ctrl-h/j/k/l across nvim+tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save every 15 min
set -g @plugin 'catppuccin/tmux#v2.1.3'            # theme (pinned version)

set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style 'rounded'

# --- Persistence ------------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'          # restore nvim sessions too
# Auto-restore OFF: bare `tmux` creates session "0", then resurrect kills it after
# restore — that race often prints [exited] and leaves no server. Continuum still
# auto-saves; restore manually with Ctrl-a Ctrl-r when you want the old layout.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# --- Pane focus chrome (peach = active, matches Herdr ui.accent) ------------
set -g pane-border-style "fg=#acb0be"
set -g pane-active-border-style "fg=#fe640b,bold"
set -g display-panes-colour "#acb0be"
set -g display-panes-active-colour "#fe640b"
# Ctrl-a q → pane numbers. Digits are consumed by display-panes (select pane),
# so they never hit the window table. Ctrl-a 1..9 still switches WINDOWS only.
# -d 0 = wait until a digit or Esc (no timed flash).
set -g display-panes-time 0
bind q display-panes -d 0

# --- Status bar -------------------------------------------------------------
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
# Flash a peach PREFIX pill while Ctrl-a is armed (matches Herdr hint bar).
set -g status-left "#{?client_prefix,#[bg=#fe640b]#[fg=#eff1f5 bold] PREFIX #[default] ,}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# Auto-install TPM on a fresh machine, then load plugins.
# (Prefix + I installs/updates plugins manually.)
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
