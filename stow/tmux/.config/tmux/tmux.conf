# tmux — terminal sessions that survive closing the window.
# Prefix is Ctrl-b (press Ctrl-b, release, then the key).
# Pane movement uses WASD (not hjkl) so it matches gaming muscle memory:
#   Ctrl-a/w/s/d  left / up / down / right across tmux panes AND nvim splits
# Cheat sheet:
#   Ctrl-b c      new window          Ctrl-b 1..9   go to window
#   Ctrl-b |      split right         Ctrl-b -      split down
#   Ctrl-a/w/s/d  move panes (no prefix — works into nvim too)
#   Alt-a/w/s/d   resize pane by 5 (with prefix: Ctrl-b Alt-WASD)
#   Ctrl-b Ctrl-d detach (session keeps running)    ta <name> / tmux attach
#   Ctrl-b T      sesh session picker (fzf)
#   Ctrl-b o      last sesh session
#   Ctrl-b S      session tree        Ctrl-b ( / )  prev/next session
#   Ctrl-b r      reload this config
# Shell: tn/ta/tl/tk session aliases · tm = sesh picker from zsh

# --- Core -------------------------------------------------------------------
set -g prefix C-b                 # Ctrl-b frees Ctrl-a for WASD "left"
unbind C-a
bind C-b send-prefix              # press Ctrl-b twice to send a literal Ctrl-b

set -g mouse on                   # click panes, drag borders, wheel scroll
set -g base-index 1               # windows number from 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on        # closing window 2 renumbers 3 -> 2
set -sg escape-time 0             # no delay after Esc (matters in nvim)
set -g history-limit 100000
set -g detach-on-destroy off      # killing a session jumps to the next one
set -g focus-events on            # pass focus to apps (nvim autoread)
set -g status-interval 5
set -g set-clipboard on           # use system clipboard when possible
set -g display-time 2000

# True color so nvim/starship themes render correctly inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# --- Windows / panes (always keep current directory) ------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Prefix + awsd pane focus (Ctrl-awsd without prefix via vim-tmux-navigator)
# a=left  w=up  s=down  d=right
bind a select-pane -L
bind w select-pane -U
bind s select-pane -D
bind d select-pane -R

# Resize panes with Alt+WASD (repeatable) — keeps Shift letters free
bind -r M-a resize-pane -L 5
bind -r M-w resize-pane -U 5
bind -r M-s resize-pane -D 5
bind -r M-d resize-pane -R 5

# Session navigation — detach moved off `d` so `d` can mean pane-right
bind ( switch-client -p
bind ) switch-client -n
bind S choose-tree -Zs            # session tree (Shift-S; lowercase s = pane down)
bind C-d detach-client            # Ctrl-b Ctrl-d detach (lowercase d = pane right)

# Kill pane without confirmation (faster than default prompt)
bind x kill-pane

# --- Copy mode (vim-style) --------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# WASD pane jumps from copy-mode too
bind -T copy-mode-vi C-a select-pane -L
bind -T copy-mode-vi C-w select-pane -U
bind -T copy-mode-vi C-s select-pane -D
bind -T copy-mode-vi C-d select-pane -R

# --- sesh: fzf-powered session picker (Ctrl-b T) ----------------------------
# Lists tmux sessions + zoxide directories + configs; picking one attaches/creates.
bind T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' \
    --prompt='⚡ ' \
    --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^f find  ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️ )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)' \
    --preview 'sesh preview {}' \
    --preview-window 'right:55%'
)\""

# Jump back to the previous sesh session
bind o run-shell "sesh last || tmux display-message -d 1500 'Only one session'"

# --- Plugins (TPM) ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'    # Ctrl-a/w/s/d across nvim+tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save every 15 min
set -g @plugin 'catppuccin/tmux#v2.1.3'            # theme (pinned version)

# WASD instead of hjkl (must match nvim plugin keymaps)
set -g @vim_navigator_mapping_left  "C-a"
set -g @vim_navigator_mapping_up    "C-w"
set -g @vim_navigator_mapping_down  "C-s"
set -g @vim_navigator_mapping_right "C-d"
set -g @vim_navigator_mapping_prev  ""             # disable Ctrl-\ 

set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style 'rounded'

# --- Persistence ------------------------------------------------------------
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'          # restore nvim sessions too
set -g @continuum-restore 'on'                     # restore on tmux start
set -g @continuum-save-interval '15'

# --- Status bar -------------------------------------------------------------
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# Auto-install TPM on a fresh machine, then load plugins.
# (Prefix + I installs/updates plugins manually.)
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
