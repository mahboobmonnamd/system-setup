# tmux — terminal sessions that survive closing the window.
# Prefix is Ctrl-a (press Ctrl-a, release, then the key).
# Cheat sheet:
#   Ctrl-a c      new window          Ctrl-a 1..9   go to window
#   Ctrl-a |      split right         Ctrl-a -      split down
#   Ctrl-h/j/k/l  move between panes (no prefix — works into nvim too)
#   Ctrl-a d      detach (session keeps running)    tmux attach  to return
#   Ctrl-a T      sesh session picker (fzf)
#   Ctrl-a r      reload this config

# --- Core -------------------------------------------------------------------
set -g prefix C-a                 # Ctrl-a is easier to reach than Ctrl-b
unbind C-b
bind C-a send-prefix              # press Ctrl-a twice to send a literal Ctrl-a

set -g mouse on                   # click panes, drag borders, wheel scroll
set -g base-index 1               # windows number from 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on        # closing window 2 renumbers 3 -> 2
set -sg escape-time 0             # no delay after Esc (matters in nvim)
set -g history-limit 50000
set -g detach-on-destroy off      # killing a session jumps to the next one

# True color so nvim/starship themes render correctly inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# --- Splits & reload --------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"   # new pane keeps current dir
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# --- Copy mode (vim-style) --------------------------------------------------
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- sesh: fzf-powered session picker (Ctrl-a T) ----------------------------
# Lists tmux sessions + zoxide directories; picking one attaches or creates.
bind T run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-border --prompt='⚡ ' \
    --header '  ^a all  ^t tmux  ^x zoxide  ^d kill' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+reload(sesh list --icons)'
)\""

# --- Plugins (TPM) ----------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'        # sane defaults
set -g @plugin 'christoomey/vim-tmux-navigator'    # Ctrl-h/j/k/l across nvim+tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'       # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'       # auto-save every 15 min
set -g @plugin 'catppuccin/tmux#v2.1.3'            # theme (pinned version)

set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style 'rounded'
set -g @continuum-restore 'on'                     # restore on tmux start

# Status bar: window list left, session name right
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Auto-install TPM on a fresh machine, then load plugins.
# (Prefix + I installs/updates plugins manually.)
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
