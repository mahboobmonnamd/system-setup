# Herdr — agent multiplexer (runs inside cmux or Ghostty).
# Keys + Latte theme intentionally mirror stow/tmux/.config/tmux/tmux.conf.
# Docs: https://herdr.dev/docs/configuration/ · in-app: prefix+?
#
# One-time plugins:  make herdr-plugins
#   - paulbkim-dev/vim-herdr-navigation  (Ctrl-hjkl ↔ nvim)
#   - ugurtarlig/herdr-pane-picker       (Ctrl-a q → on-pane hints)

onboarding = false

# --- Theme (Catppuccin Latte — same as tmux / Ghostty / starship) ------------
[theme]
name = "catppuccin-latte"

[theme.custom]
# Latte peach — high-contrast active pane border / focus chrome on cream.
accent = "#fe640b"

[terminal]
# New panes inherit focused pane/workspace cwd (tmux -c "#{pane_current_path}").
new_cwd = "follow"
# macOS: login shell so Homebrew / path_helper apply in new panes.
shell_mode = "auto"

[session]
resume_agents_on_restore = true

[keys]
# Same prefix as tmux.conf
prefix = "ctrl+a"

# --- Tabs (tmux windows) ----------------------------------------------------
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
switch_tab = "prefix+1..9"
rename_tab = "prefix+comma"          # tmux: prefix+,
close_tab = "prefix+shift+x"

# --- Splits (tmux panes) ----------------------------------------------------
# Literal | — terminal delivers composed |, not shift+backslash.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+x"
zoom = "prefix+z"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
# Free Shift-H/J/K/L for resize (tmux bind -r H/J/K/L). Swap moves to Alt.
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"
# tmux: prefix+r reloads config. Resize mode stays available as prefix+Ctrl-r.
reload_config = "prefix+r"
resize_mode = "prefix+ctrl+r"

# --- Workspaces (tmux sessions) ---------------------------------------------
workspace_picker = "prefix+s"        # tmux: session tree
settings = "prefix+shift+s"
goto = "prefix+shift+t"              # tmux: sesh (Ctrl-a T)
previous_workspace = "prefix+("
next_workspace = "prefix+)"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
last_pane = "prefix+o"               # tmux: sesh last
open_notification_target = ""        # use cmux Cmd+I / Cmd+Shift+U instead

# --- Session lifecycle ------------------------------------------------------
detach = "prefix+d"
toggle_sidebar = "prefix+b"

# --- Copy mode --------------------------------------------------------------
copy_mode = ["prefix+enter", "prefix+["]

# --- UI (visual parity with tmux status on top + mouse) ----------------------
[ui]
# Needed for click-to-focus panes (false = tmux-style pass-through only).
mouse_capture = true
# Full redraw on outer focus feels like a flash/lag when clicking back into
# cmux/Ghostty or hopping panes that trigger focus reports. Safer default is
# true; we prefer snappy mouse focus.
redraw_on_focus_gained = false
# Bottom tab row so Ctrl-a PREFIX mode can replace it with a clear
# "PREFIX …" hint bar (hard to miss). Top tabs leave the hint easy to overlook.
tab_bar_position = "bottom"
# Always keep the tab/mode row (PREFIX bar needs a home even with one tab).
hide_tab_bar_when_single_tab = false
prompt_new_tab_name = false
pane_borders = true
# Gap + peach accent makes the focused pane frame obvious at a glance.
pane_gaps = true
# Agent names live in the sidebar; border labels re-paint on focus and feel slow.
show_agent_labels_on_pane_borders = false
agent_panel_sort = "priority"
# Active pane border / focus chrome (must match theme.custom.accent).
accent = "#fe640b"

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]
codex = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[advanced]
# ~same ballpark as tmux history-limit 100000 / Ghostty scrollback-limit.
scrollback_limit_bytes = 10000000

# --- Resize: prefix+H/J/K/L (tmux resize-pane -L/-D/-U/-R 5) -----------------
# Amount is a layout ratio (~5%), not cells — closest Herdr equivalent.
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr pane resize --direction left --amount 0.05 --current"
description = "resize pane left (tmux H)"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr pane resize --direction down --amount 0.05 --current"
description = "resize pane down (tmux J)"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr pane resize --direction up --amount 0.05 --current"
description = "resize pane up (tmux K)"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane resize --direction right --amount 0.05 --current"
description = "resize pane right (tmux L)"

# --- Ctrl-h/j/k/l: same as vim-tmux-navigator (needs make herdr-plugins) ----
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Scratch shell popup (Herdr-only; tmux has no twin).
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-zsh}\""
description = "scratch terminal"
width = "80%"
height = "80%"

# Pane picker — flash a/s/d/f hints on panes, type one to focus
# (tmux display-panes twin; needs make herdr-plugins + kitty_graphics).
[[keys.command]]
key = "prefix+q"
type = "plugin_action"
command = "ugurtarlig.pane-picker.open"
description = "pick pane by on-pane hint (tmux q)"

# Kitty graphics required by pane-picker badges (Ghostty / cmux OK).
# If enabled after Herdr is already open: detach (Ctrl-a d) and `hr` again.
[experimental]
kitty_graphics = true
