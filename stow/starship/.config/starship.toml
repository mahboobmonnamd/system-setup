# Starship prompt — Catppuccin Latte (light). Docs: https://starship.rs/config/
# Starship only shows modules relevant to the current directory (git info in
# repos, node version in node projects, etc.). This file themes it and trims.

palette = "catppuccin_latte"
add_newline = true       # blank line between prompts — commands don't cramp
command_timeout = 1000   # wait up to 1s for slow git repos before skipping

# ❯ green on success, red after a failed command — instant visual feedback
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[directory]
style = "bold blue"
truncation_length = 0          # 0 = never truncate — show the full path
truncate_to_repo = false       # don't shorten to the repo root; show it all
# Home still shows as ~ ; set home_symbol = "/Users/you" for a literal absolute path

[git_branch]
style = "bold mauve"

[git_status]
style = "bold red"

[cmd_duration]
min_time = 2000                # only show for commands slower than 2s
format = "took [$duration](yellow) "

# Language versions: shown only inside matching projects, kept subtle
[nodejs]
format = "[ $version](green) "
[golang]
format = "[󰟓 $version](sapphire) "
[rust]
format = "[󱘗 $version](peach) "
[python]
format = "[ $version](yellow) "

# Kubernetes context is hidden by default (noisy); flip to false when you
# want to always see which cluster kubectl points at.
[kubernetes]
disabled = true

